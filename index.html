<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Skool Content Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: an infinite pan/zoom canvas. Three effort zones sit left to right (easy -> hard),
   each a snaking trail of numbered stops. Fixed toolbar on top, zoom controls bottom-right. */
:root{
  --ground:#e9eef0; --dot:#c9d3d8; --ink:#17232b; --muted:#5b6b75; --card:#ffffff; --line:#d5dee3;
  --g:#2f9e5b; --g-soft:#e2f4e8; --g-ink:#1d6b3c;
  --y:#e0a400; --y-soft:#fbf1d2; --y-ink:#8a6400;
  --r:#d6453d; --r-soft:#fbe3e1; --r-ink:#9b2a24;
  --bar:rgba(255,255,255,.88);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#11181d; --dot:#26323a; --ink:#e6edf0; --muted:#94a3ac; --card:#1a242b; --line:#2d3a43;
  --g:#45c07a; --g-soft:#173426; --g-ink:#7fdca5;
  --y:#f2bd2c; --y-soft:#3a3115; --y-ink:#f6d47a;
  --r:#f0625a; --r-soft:#3d1d1c; --r-ink:#f7a29c;
  --bar:rgba(20,28,33,.9); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#11181d; --dot:#26323a; --ink:#e6edf0; --muted:#94a3ac; --card:#1a242b; --line:#2d3a43;
  --g:#45c07a; --g-soft:#173426; --g-ink:#7fdca5;
  --y:#f2bd2c; --y-soft:#3a3115; --y-ink:#f6d47a;
  --r:#f0625a; --r-soft:#3d1d1c; --r-ink:#f7a29c;
  --bar:rgba(20,28,33,.9); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);overflow:hidden;}
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--dot) 1.2px, transparent 1.3px);background-size:24px 24px;}
#stage.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;gap:160px;padding:120px;align-items:flex-start;will-change:transform}

/* ---------- toolbar ---------- */
.bar{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar h1{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.bar h1 span{color:var(--muted);font-weight:500}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group-label{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:2px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip:focus-visible,.zoom button:focus-visible,.card:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.swatch{width:10px;height:10px;border-radius:50%}
.count{font-family:var(--f-mono);font-size:11px;opacity:.7}

.zoom{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;
  background:var(--bar);border:1px solid var(--line);border-radius:12px;overflow:hidden;backdrop-filter:blur(8px)}
.zoom button{border:0;background:none;width:44px;height:40px;font-size:20px;line-height:1}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--line)}
.zoom .pct{font-family:var(--f-mono);font-size:11px;text-align:center;padding:6px 0;border-top:1px solid var(--line);color:var(--muted)}
.hint{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;font-size:12px;color:var(--muted);background:var(--bar);
  padding:6px 10px;border-radius:8px;border:1px solid var(--line)}

/* ---------- zones ---------- */
.zone{--c:var(--g);--soft:var(--g-soft);--cink:var(--g-ink);width:1250px;flex:none;border-radius:40px;padding:64px;
  background:color-mix(in srgb, var(--soft) 55%, transparent);border:3px solid color-mix(in srgb, var(--c) 35%, transparent)}
.zone.yellow{--c:var(--y);--soft:var(--y-soft);--cink:var(--y-ink)}
.zone.red{--c:var(--r);--soft:var(--r-soft);--cink:var(--r-ink)}
.zone-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:56px;border-bottom:4px solid var(--c);padding-bottom:24px}
.zone-eyebrow{font-family:var(--f-mono);font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--cink)}
.zone-title{font-family:var(--f-display);font-weight:800;font-size:150px;line-height:.88;letter-spacing:-.04em;margin:8px 0 0;color:var(--ink)}
.zone-title i{font-style:normal;color:var(--c)}
.zone-meta{text-align:right;font-size:24px;color:var(--muted);line-height:1.35}
.zone-meta b{display:block;font-family:var(--f-display);font-size:72px;line-height:1;color:var(--cink)}
.trail{position:relative}
.trail svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.row{display:flex;gap:48px;align-items:flex-start;margin-bottom:72px}
.row.rev{flex-direction:row-reverse;justify-content:flex-start}
.row:last-child{margin-bottom:0}

/* ---------- cards ---------- */
.card{position:relative;width:340px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:44px 26px 26px;
  box-shadow:0 1px 0 var(--line), 0 10px 30px -18px rgba(0,0,0,.35);transition:opacity .25s, filter .25s}
.card.dim{opacity:.18;filter:grayscale(1)}
.stop{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:var(--c);color:#fff;
  display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px;border:5px solid var(--card);box-shadow:0 0 0 2px var(--c)}
.zone.yellow .stop{color:#2b2000}
.rank{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.meter{display:flex;gap:3px}
.meter i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--c)}
.card h3{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.08;letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
.media{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.media span{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:6px;background:var(--soft);color:var(--cink);border:1px solid color-mix(in srgb, var(--c) 30%, transparent)}
.desc{margin:0;padding-left:20px;font-size:16px;line-height:1.5}
.desc ul{padding-left:20px;margin:4px 0;font-size:15px;color:var(--muted)}
.desc li{margin:3px 0}
.desc li::marker{color:var(--c)}
.desc blockquote{margin:6px 0;padding:8px 12px;border-left:3px solid var(--c);background:var(--soft);border-radius:0 8px 8px 0;font-size:14px;color:var(--ink);font-style:italic}
.note{font-family:var(--f-mono);font-size:12px;color:var(--cink)}

.arrow{align-self:center;font-family:var(--f-display);font-size:140px;color:var(--muted);opacity:.5;margin:0 -110px;flex:none}

@media (max-width:640px){.hint{display:none}.bar h1{font-size:16px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<div id="stage">
  <div id="world"></div>
</div>

<header class="bar">
  <h1>Skool Content Map <span>· Level 1</span></h1>
  <div class="group" id="zoneNav"><span class="group-label">Go to</span></div>
  <div class="group" id="mediaFilter"><span class="group-label">Medium</span></div>
</header>

<div class="zoom" aria-label="Zoom controls">
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">−</button>
  <button id="zfit" aria-label="Fit whole map" title="Fit whole map" style="font-size:15px">⤢</button>
  <div class="pct" id="pct">100%</div>
</div>
<div class="hint">Drag to move · scroll or pinch to zoom · click a card to focus it</div>

<script>
const ZONES = [
 {key:"green", name:"Green", label:"Easy to make", items:[
  {t:"AI Prompt Instructions Sheet", m:"Inline Text", d:[
    "Prompts to put into AI to help it correct your language, create resources for you, and give you feedback",
    "Help you discover how to correct yourself and not be handed the answers because AI does that"]},
  {t:"Frequency Word List", m:"Inline Text + Video", d:[
    "Most common words in General American English",
    "Video of Amelia reading them for pronunciation"]},
  {t:"Songs", m:"Inline Text", d:[
    ["List of song recommendations to help you practice grammar, speech patterns, and sounds",["Link to video on YouTube","English lyrics"]]]},
  {t:"Vocab for Instructions", m:"Inline Text", d:[
    ["Vocab set for the most essential words to understand the lesson",["in your head vs. out loud","Notice","Investigate","Imitate"]]]},
  {t:"Vocab for Strategic Competence", m:"Inline Text", d:[
    "Vocab set that teaches you what to say when you don't know what to say",
    "Aka. your language is incomplete, but you can keep communicating"]},
  {t:"IPA Flash Cards", m:"Quizlet", d:[
    "IPA symbols for General American accent",
    "App ??",
    "Supplemental WordWall games"]},
  {t:"Imitation Shorts/Clips", m:"Video", d:[
    ["Many short clips of the same phrase in a stitched video of various 3rd party clips",["Very short video so they can repeat it many times","Notice and repeat"]],
    "Underneath videos will be prompts to draw their attention to certain sound changes",
    "Main Instruction / Discussion: Think of a specific time you can use this phrase"]},
  {t:"Recommended Content List", m:"Inline Text + Video", d:[
    "Living doc of recommended content from Amelia",
    "Added video explaining approach to self-selecting content"]},
  {t:"Learn 10 random words with me", m:"Video", d:[
    "Screencast style video",
    "Random word generator and Amelia teaches ad hoc"]},
  {t:"Answer a random question with me", m:"Video", d:[
    "Reading answers to questions as well as giving the flip side",
    "Creative, imaginative, controversial, scenario-based",
    "Amelia selects words to highlight under video after recording"]},
  {t:"Learn from Movies / TV", m:"Video", d:[
    "Instructional video for how to consume movies and TV for learning English",
    ["Familiar movies: only the language is new",[{q:"I recommend watching a movie you are very familiar with. Put it in English with no subtitles. If you're new to watching content in English, I recommend only listening for fun until you no longer dread watching movies or TV shows in English. Basically, until it becomes relaxing and enjoyable. Once you've gotten your brain comfortable with watching content in English, add goals: occasionally mimic the characters, record their voice on your phone to listen to later, choose one word or phrase from the movie that you liked and want to remember."}]],
    ["New movies/TV shows: content AND language is new",[{q:"For new movies or TV shows, I recommend reading the synopsis first (but be careful of spoilers). After the movie, explain the story to yourself and record it or write it down. Check online with the plot and see if you understood properly. Choose one word or phrase that you liked from the movie."},{q:"The reason why I don't recommend this option as much is because the content is new and the language is new, whereas the other option only has one new factor (language), and thus it has a lower cognitive load."}]]]}
 ]},
 {key:"yellow", name:"Yellow", label:"Medium effort", items:[
  {t:"Replay Audios", m:"Inline Text + Audio File", d:[
    ["Small audios that students can repeat easily",[
      ["Mini Stories (about 1 minute)",["English transcriptions","Audio","WordWall"]],
      ["Short Dialogues (about 1 minute)",["Structure: one person asking another a question, followed by opinion in response","English transcription","Audio","Discussion post of student answering the question"]]]]]},
  {t:"Character Mimics", m:"Inline Text + Audio File", d:[
    "Use group interview style YouTube videos",
    "Choose one of the characters to mimic",
    "Only speak when they speak",
    ["Act like the character",["Video + Instructions","Example of Amelia doing it"]]]},
  {t:"Read, Speak-Along", m:"Video", d:[
    ["Take a text and make it sound natural alongside Ms. Amelia",["Short script via student request","Story","News article","Etc."]]]},
  {t:"Self-Study Exercises", m:"Inline Text + Video", d:[
    ["5-finger explanation demonstration",["Infographic","Link to Amelia's research"]],
    ["Transformational Reading",["How to read a text multiple times to increase your comprehension and absorb the grammar structures"]]]},
  {t:"English Pronunciation vs. Spelling Crash Course", m:"Slides Video", d:[
    "Teaching how the English pronunciation system and English spelling system differ"]},
  {t:"Language Learning Tips", m:"YouTube Video + Animation", d:[
    "AB records lecture",
    "OE takes audio and makes animation"]},
  {t:"Speech Patterns", m:"Inline Text + Audio", d:[
    "Mini lessons","WordWall practice","Speaking prompt"]},
  {t:"Mini Podcast", m:"Audio", d:[
    "Amelia speaks about anything she wants",
    "Selects language after",
    "Topics can be recommended"]},
  {t:"Games", m:"Video", d:[
    "Which picture?",
    "Follow my instructions (interactive)",
    "Speed Read/Describe (WordWall)"]},
  {t:"Sound Discover", m:"Video + Animation", d:[
    ["Differentiation practice",[
      ["Noticing/Perception",["Can you hear the difference between \"p\" and \"b\""]],
      "WordWall games and activities","Animation"]]]}
 ]},
 {key:"red", name:"Red", label:"Hardest to make", items:[
  {t:"Skills", m:"Video", d:[
    ["Long-ish form videos",[
      ["Expanding on tip from Language Skill video from [YELLOW]",["Investigating mistakes and gaps"]],
      ["Learn by:",["Speaking","Reading","Writing","Listening"]]]]]},
  {t:"How to learn based on what you like", m:"Inline Text + Video", d:[
    ["Video + activity recommendations",[["You like to:",["Read","Watch","Art","Music","Etc."]]]]]},
  {t:"Guest Interviews", m:"Video", d:[
    {n:"Internal note: Ben y Maria inspired"},
    "With English transcript after recording"]},
  {t:"Sound Differentiation Lessons", m:"Inline Text + Video", d:[
    "Perceive, listen, and identify",
    "Get names for what you identify.",
    "Listen and differentiate in context. Here, the pronunciation difference before the mechanics in production.",
    "Train ears before the why and the when.",
    "Discover the context of when and why the sound is made this way.",
    "How to produce the sound number seven, controlled production with context provided low, low, challenge, high support.",
    "Identify errors and correct them in another speaker. Produce, identify your mistakes by investigating context and checking answers by comparing to native based on sounds.",
    "More production practice. Production increases throughout the lesson from very minimal to maximal production in the end, changing from listening to speaking"]},
  {t:"Pragmatics and Functions", m:"Video", d:[
    ["Aka nuance and meaning",[["Dissection and discovery",["Follow-along video with Amelia"]],"Associated with culture"]]]},
  {t:"English Basics", m:"Video", d:[
    ["Greek class inspired",["Copy structure into English","Needs research"]],
    ["Shababeek Level 1 Book",["Make a digital English version with companion videos"]]]},
  {t:"Monthly Language Learning Magazine", m:"PDF", d:[
    "Activities","Stories","Reports","Honorable mention for community members","Member submitted works"]}
 ]}
];

// medium -> filter group
const MEDIA = ["Inline Text","Video","Audio","Animation","Slides","Quizlet","PDF"];
const mediaOf = m => m.split("+").map(s=>s.trim()).map(s=>
  /audio/i.test(s)?"Audio":/slides/i.test(s)?"Slides":/video/i.test(s)?"Video":s);

const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function list(items){
  return items.map(it=>{
    if(typeof it==="string") return `<li>${esc(it)}</li>`;
    if(it.q) return `<blockquote>“${esc(it.q)}”</blockquote>`;
    if(it.n) return `<li class="note">${esc(it.n)}</li>`;
    return `<li>${esc(it[0])}<ul>${list(it[1])}</ul></li>`;
  }).join("");
}

const world = document.getElementById("world");
const TOTAL = ZONES.reduce((a,z)=>a+z.items.length,0);
let globalRank = 0;
const zoneEls = [];
ZONES.forEach((z,zi)=>{
  if(zi>0){const a=document.createElement("div");a.className="arrow";a.textContent="→";a.setAttribute("aria-hidden","true");world.appendChild(a);}
  const el=document.createElement("section");
  el.className="zone "+z.key; el.id=z.key;
  const rows=[];
  for(let i=0;i<z.items.length;i+=3) rows.push(z.items.slice(i,i+3).map((it,j)=>({...it,n:i+j+1})));
  el.innerHTML=`
    <div class="zone-head">
      <div><div class="zone-eyebrow">Zone ${zi+1} of 3 · ${z.label}</div><h2 class="zone-title"><i>●</i> ${z.name}</h2></div>
      <div class="zone-meta"><b>${z.items.length}</b>pieces of content<br>ranked 1–${z.items.length}, easy → hard</div>
    </div>
    <div class="trail"><svg aria-hidden="true"></svg>
      ${rows.map((r,ri)=>`<div class="row${ri%2?" rev":""}">${r.map(it=>{
        globalRank++;
        const meds=mediaOf(it.m);
        return `<article class="card" tabindex="0" data-media="${meds.join("|")}" aria-label="${z.name} ${it.n}: ${esc(it.t)}">
          <div class="stop">${it.n}</div>
          <div class="rank"><span>${z.name.toUpperCase()} ${it.n}/${z.items.length}</span>
            <span class="meter" title="Overall effort ${globalRank} of ${TOTAL}">${Array.from({length:z.items.length},(_,k)=>`<i class="${k<it.n?"on":""}"></i>`).join("")}</span></div>
          <h3>${esc(it.t)}</h3>
          <div class="media">${it.m.split("+").map(s=>`<span>${esc(s.trim())}</span>`).join("")}</div>
          <ul class="desc">${list(it.d)}</ul>
        </article>`}).join("")}</div>`).join("")}
    </div>`;
  world.appendChild(el); zoneEls.push(el);
});

// draw trail lines through the stops in order
function drawTrails(){
  zoneEls.forEach(z=>{
    const trail=z.querySelector(".trail"), svg=trail.querySelector("svg");
    const cards=[...trail.querySelectorAll(".card")];
    const pts=cards.map(c=>{
      let x=c.offsetLeft+c.offsetWidth/2, y=c.offsetTop, p=c.offsetParent;
      while(p&&p!==trail){x+=p.offsetLeft;y+=p.offsetTop;p=p.offsetParent;}
      return [x,y];
    });
    svg.setAttribute("width",trail.offsetWidth);svg.setAttribute("height",trail.offsetHeight);
    let d=""; const R=40;
    for(let i=0;i<pts.length;i++){
      const [x,y]=pts[i];
      if(!i){d+=`M${x} ${y}`;continue;}
      const [px,py]=pts[i-1];
      if(Math.abs(py-y)<1){d+=` L${x} ${y}`;}
      else{ // row change: drop down the outside edge of the zone
        const ox = px>trail.offsetWidth/2 ? px+200 : px-200, dir = ox>px?1:-1;
        d+=` L${ox-dir*R} ${py} Q${ox} ${py} ${ox} ${py+R} L${ox} ${y-R} Q${ox} ${y} ${ox-dir*R} ${y} L${x} ${y}`;
      }
    }
    svg.innerHTML=`<path d="${d}" fill="none" stroke="var(--c)" stroke-width="6" stroke-dasharray="2 16" stroke-linecap="round" opacity=".8"/>`;
  });
}

// ---------- pan / zoom ----------
const stage=document.getElementById("stage"), pct=document.getElementById("pct");
let s=1, tx=0, ty=0;
const MIN=.08, MAX=2.5;
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;pct.textContent=Math.round(s*100)+"%";}
function zoomAt(f,cx,cy){
  const ns=Math.min(MAX,Math.max(MIN,s*f)); f=ns/s;
  tx=cx-(cx-tx)*f; ty=cy-(cy-ty)*f; s=ns; apply();
}
function topInset(){return document.querySelector(".bar").offsetHeight;}
function fitRect(x,y,w,h,pad=40,anim=true){
  const vw=innerWidth, vh=innerHeight-topInset();
  const ns=Math.min(MAX,Math.max(MIN,Math.min((vw-pad*2)/w,(vh-pad*2)/h)));
  const ntx=(vw-w*ns)/2-x*ns, nty=topInset()+(vh-h*ns)/2-y*ns;
  animateTo(ns,ntx,nty,anim);
}
let raf;
function animateTo(ns,ntx,nty,anim){
  cancelAnimationFrame(raf);
  if(!anim||matchMedia("(prefers-reduced-motion: reduce)").matches){s=ns;tx=ntx;ty=nty;apply();return;}
  const s0=s,x0=tx,y0=ty,t0=performance.now(),D=450;
  const step=t=>{let k=Math.min(1,(t-t0)/D);k=1-Math.pow(1-k,3);
    s=s0+(ns-s0)*k;tx=x0+(ntx-x0)*k;ty=y0+(nty-y0)*k;apply();if(k<1)raf=requestAnimationFrame(step);};
  raf=requestAnimationFrame(step);
}
function rectOf(el){ // world-space rect
  let x=0,y=0,p=el; while(p&&p!==world){x+=p.offsetLeft;y+=p.offsetTop;p=p.offsetParent;}
  return [x,y,el.offsetWidth,el.offsetHeight];
}
const fitAll=(anim=true)=>fitRect(0,0,world.offsetWidth,world.offsetHeight,24,anim);

stage.addEventListener("wheel",e=>{e.preventDefault();cancelAnimationFrame(raf);
  const f=e.ctrlKey?Math.exp(-e.deltaY*.01):Math.exp(-e.deltaY*.0015);zoomAt(f,e.clientX,e.clientY);},{passive:false});

const ptrs=new Map(); let moved=0, pinch=null, downCard=null;
stage.addEventListener("pointerdown",e=>{cancelAnimationFrame(raf);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;downCard=e.target.closest(".card");
  stage.setPointerCapture(e.pointerId);stage.classList.add("dragging");
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])};}});
stage.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const [ox,oy]=ptrs.get(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1){tx+=e.clientX-ox;ty+=e.clientY-oy;moved+=Math.abs(e.clientX-ox)+Math.abs(e.clientY-oy);apply();}
  else if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    zoomAt(d/pinch.d,(a[0]+b[0])/2,(a[1]+b[1])/2);pinch.d=d;moved+=99;}
});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)stage.classList.remove("dragging");};
stage.addEventListener("pointerup",e=>{
  if(moved<5&&ptrs.size===1&&downCard)focusCard(downCard);
  up(e);});
stage.addEventListener("pointercancel",up);

function focusCard(c){const [x,y,w,h]=rectOf(c);fitRect(x,y-40,w,h+40,60);}
world.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("card"))focusCard(e.target);});
document.getElementById("zin").onclick=()=>zoomAt(1.3,innerWidth/2,innerHeight/2);
document.getElementById("zout").onclick=()=>zoomAt(1/1.3,innerWidth/2,innerHeight/2);
document.getElementById("zfit").onclick=()=>fitAll();
addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  if(e.key==="+"||e.key==="=")zoomAt(1.3,innerWidth/2,innerHeight/2);
  else if(e.key==="-")zoomAt(1/1.3,innerWidth/2,innerHeight/2);
  else if(e.key==="0")fitAll();
});

// ---------- nav + filter ----------
const nav=document.getElementById("zoneNav");
const all=document.createElement("button");all.className="chip";all.textContent="Whole map";all.onclick=()=>fitAll();nav.appendChild(all);
ZONES.forEach((z,i)=>{const b=document.createElement("button");b.className="chip";
  b.innerHTML=`<span class="swatch" style="background:var(--${z.key[0]})"></span>${z.name} <span class="count">${z.items.length}</span>`;
  b.onclick=()=>{const [x,y,w,h]=rectOf(zoneEls[i]);fitRect(x,y,w,h,24);};nav.appendChild(b);});

const filt=document.getElementById("mediaFilter"); const active=new Set();
const cards=[...document.querySelectorAll(".card")];
MEDIA.forEach(m=>{
  const n=cards.filter(c=>c.dataset.media.split("|").includes(m)).length; if(!n)return;
  const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed","false");
  b.innerHTML=`${m} <span class="count">${n}</span>`;
  b.onclick=()=>{active.has(m)?active.delete(m):active.add(m);b.setAttribute("aria-pressed",active.has(m));
    cards.forEach(c=>{const ms=c.dataset.media.split("|");c.classList.toggle("dim",active.size>0&&![...active].some(a=>ms.includes(a)));});};
  filt.appendChild(b);
});

function init(){drawTrails();fitAll(false);}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(init);
init();
addEventListener("resize",()=>fitAll(false));
</script>

</body></html>
